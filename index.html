<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sidequest — turn your to-dos into an adventure</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3F6C51" />
    <meta name="description" content="Turn your to-dos into an adventure." />

    <!-- Link previews (iMessage, Snapchat, Discord, X, etc.). __SITE_URL__ is filled in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sidequest" />
    <meta property="og:title" content="Sidequest — turn your to-dos into an adventure" />
    <meta property="og:description" content="A to-do list that plays like a board game. Earn XP, level up, unlock gear and pets, and send quests to friends." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sidequest: turn your to-dos into an adventure" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sidequest — turn your to-dos into an adventure" />
    <meta name="twitter:description" content="A to-do list that plays like a board game. Earn XP, level up, and send quests to friends." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- iOS "add to home screen" support -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sidequest" />
  </head>
  <body style="margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
